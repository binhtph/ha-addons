name: IRIS Face Recognition
version: "2.0.1"
slug: iris_face_recognition
description: Local face recognition for Home Assistant using IRIS/InsightFace
url: https://github.com/anhnvme/facedetect
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 80
panel_icon: mdi:face-recognition
panel_title: IRIS
ports:
  80/tcp: 8080
ports_description:
  80/tcp: Direct web UI and API access (no login; the sidebar panel works without it)
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - share:rw
  - media:rw
options:
  data_dir: /homeassistant/iris
schema:
  data_dir: str
